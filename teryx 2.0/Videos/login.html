<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teryx — Аккаунт</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 60px auto;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .card {
            background: #1b1b1b;
            border: 1px solid #2b2b2b;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
        }

        h1, h2 {
            margin-top: 0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            background: #292929;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #383838;
        }

        button.active {
            background: #e1b143;
            color: #111;
        }

        .primary {
            background: #e1b143;
            color: #111;
            font-weight: 700;
        }

        .danger {
            background: #8d3030;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: #e1b143;
        }

        label {
            font-size: 14px;
            color: #aaa;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .message {
            min-height: 20px;
            margin-top: 15px;
            color: #aaa;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #e1b143;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            color: #aaa;
            margin-top: 5px;
        }

        .hidden {
            display: none !important;
        }

        .info {
            color: #aaa;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Teryx</div>

    <!-- НЕ АВТОРИЗОВАН -->
    <section id="authSection">

        <div class="tabs">
            <button id="loginTab" class="active">Войти</button>
            <button id="registerTab">Регистрация</button>
        </div>

        <!-- LOGIN -->

        <div id="loginBox" class="card">

            <h1>Вход</h1>

            <form id="loginForm">

                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="field">
                    <label for="loginPassword">Пароль</label>
                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button class="primary" type="submit">
                    Войти
                </button>

            </form>

            <div id="loginMessage" class="message"></div>

        </div>


        <!-- REGISTER -->

        <div id="registerBox" class="card hidden">

            <h1>Создать аккаунт</h1>

            <form id="registerForm">

                <div class="field">
                    <label for="registerUsername">Username</label>
                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="terryx123"
                        minlength="3"
                        maxlength="32"
                        required
                    >
                </div>

                <div class="field">
                    <label for="registerDisplayName">
                        Отображаемое имя
                    </label>

                    <input
                        id="registerDisplayName"
                        type="text"
                        placeholder="Михаил"
                        maxlength="50"
                    >
                </div>

                <div class="field">
                    <label for="registerEmail">Email</label>

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="field">
                    <label for="registerPassword">Пароль</label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Минимум 6 символов"
                        minlength="6"
                        required
                    >
                </div>

                <button class="primary" type="submit">
                    Создать аккаунт
                </button>

            </form>

            <div id="registerMessage" class="message"></div>

        </div>

    </section>


    <!-- АВТОРИЗОВАН -->

    <section id="accountSection" class="hidden">

        <div class="card">

            <div class="profile">

                <div id="avatar" class="avatar">
                    ?
                </div>

                <div>
                    <h1 id="displayName">
                        Пользователь
                    </h1>

                    <div id="username" class="username">
                        @username
                    </div>
                </div>

            </div>

        </div>


        <div class="card">

            <h2>Профиль</h2>

            <form id="profileForm">

                <div class="field">
                    <label for="profileUsername">
                        Username
                    </label>

                    <input
                        id="profileUsername"
                        type="text"
                        minlength="3"
                        maxlength="32"
                        required
                    >
                </div>

                <div class="field">
                    <label for="profileDisplayName">
                        Отображаемое имя
                    </label>

                    <input
                        id="profileDisplayName"
                        type="text"
                        maxlength="50"
                    >
                </div>

                <div class="field">
                    <label for="profileAvatar">
                        URL аватарки
                    </label>

                    <input
                        id="profileAvatar"
                        type="url"
                        placeholder="https://..."
                    >
                </div>

                <div class="field">
                    <label for="profileBio">
                        О себе
                    </label>

                    <input
                        id="profileBio"
                        type="text"
                        maxlength="500"
                        placeholder="Расскажи о себе"
                    >
                </div>

                <button class="primary" type="submit">
                    Сохранить
                </button>

            </form>

            <div id="profileMessage" class="message"></div>

        </div>


        <div class="card">

            <h2>Аккаунт</h2>

            <p class="info">
                Email:
                <strong id="accountEmail"></strong>
            </p>

            <button id="logoutButton" class="danger">
                Выйти
            </button>

        </div>

    </section>

</div>


<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="account.js"></script>

</body>
</html>
